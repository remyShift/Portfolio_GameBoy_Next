version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      next-stack:
        patterns:
          - "next"
          - "next-intl"
          - "next-themes"
          - "@next/*"
      react-stack:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tooling:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "typescript"
          - "typescript-eslint"
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
    ignore:
      # Why: typescript-eslint caps its typescript peer at <6.1.0, so any
      # TypeScript major past 6 breaks `pnpm lint`. Drop this entry once
      # typescript-eslint ships a release that supports the new major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
